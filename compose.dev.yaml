# Desarrollo: código montado, hot reload (nodemon / next dev).

services:
  backend:
    env_file:
      - ./backend/.env.development
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - cont_backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    command: ["npm", "run", "dev"]

  frontend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend-app:/app
      - cont_frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: /api
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]

  nginx:
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  cont_backend_node_modules:
  cont_frontend_node_modules:
