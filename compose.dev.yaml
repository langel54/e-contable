# Desarrollo: código montado, hot reload (nodemon / next dev).

services:
  backend:
    env_file:
      - ./backend/.env.development
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - cont_backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      SCRAPER_WORKER_URL: http://backend-worker:3101
    command: ["npm", "run", "dev"]

  backend-worker:
    env_file:
      - ./backend/.env.development
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cont_backend_worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - cont_backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      SCRAPER_WORKER_PORT: "3101"
    command: ["npm", "run", "worker:dev"]

  frontend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend-app:/app
      - cont_frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: /api
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]

  nginx:
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  cont_backend_node_modules:
  cont_frontend_node_modules:
