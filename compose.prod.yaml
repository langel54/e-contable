# Producción: imágenes multi-stage del compose base, rotación de logs.

services:
  backend:
    env_file:
      - ./backend/.env.production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
