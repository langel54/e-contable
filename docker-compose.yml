version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cont_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_cont
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cont_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/db_cont
      - ALLOWED_ORIGINS=http://127.0.0.1:80,http://localhost:80
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: cont_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=/api

  nginx:
    image: nginx:alpine
    container_name: cont_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
